<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Makelaar Monitor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="{{ url_for('index') }}">Makelaar Monitor</a>
            <nav class="topnav">
                <a href="{{ url_for('index', tab='woningen') }}" class="{% if actieve_sectie == 'woningen' %}active{% endif %}">Woningen</a>
                <a href="{{ url_for('index', tab='bedrijfsmatig') }}" class="{% if actieve_sectie == 'bedrijfsmatig' %}active{% endif %}">Bedrijfsmatig</a>
                <a href="{{ url_for('dashboard') }}" class="{% if actieve_sectie == 'dashboard' %}active{% endif %}">Dashboard</a>
            </nav>
        </div>
    </header>

    <main class="page">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <span>Makelaar Monitor &mdash; lokale toepassing</span>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
